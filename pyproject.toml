[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clicodelog"
version = "0.2.3"
description = "A lightweight, local-first web app to browse, inspect, and export logs from AI coding agents and editors (Claude Code, Codex, Gemini CLI, Cursor, VS Code Copilot Chat)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "monk1337"}
]
keywords = [
    "claude",
    "claude-code",
    "openai",
    "codex",
    "gemini",
    "gemini-cli",
    "cursor",
    "vscode",
    "copilot",
    "ai",
    "log",
    "viewer",
    "cli"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]

dependencies = [
    "fastapi>=0.104.0",
    # Plain uvicorn, not [standard]: uvloop/watchfiles/httptools/websockets are
    # all dead weight for a single-user server on loopback.
    "uvicorn>=0.24.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx",
    "build",
    "twine",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/AISmithLab/clicodelog"
Repository = "https://github.com/AISmithLab/clicodelog"
Issues = "https://github.com/AISmithLab/clicodelog/issues"

[project.scripts]
clicodelog = "clicodelog.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clicodelog*"]

[tool.setuptools.package-data]
# The vendor glob is load-bearing: "static/js/*.js" does not recurse, so every
# published wheel shipped without marked/DOMPurify/highlight.js and silently
# degraded to unrendered plain text. tests/test_packaging.py guards this.
clicodelog = [
    "templates/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "static/js/vendor/*.js",
]
