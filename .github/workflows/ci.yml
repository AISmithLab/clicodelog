name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Editor data lives in a different place on each OS (and Windows defaults
    # to a non-UTF-8 text encoding), so every platform runs the suite.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q

      # The wheel is built and inspected because the packaging bug that shipped
      # for months was invisible to an editable install: static/js/vendor/ was
      # excluded from every published wheel, so markdown rendering and syntax
      # highlighting silently degraded for anyone installing from PyPI.
      - name: Verify the wheel actually contains its assets
        shell: bash
        run: |
          python -m build --wheel --outdir dist/
          python - <<'PY'
          import glob, sys, zipfile
          whl = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(whl).namelist()
          required = [
              "static/js/vendor/marked.min.js",
              "static/js/vendor/purify.min.js",
              "static/js/vendor/highlight.min.js",
              "templates/index.html",
              "templates/view.html",
          ]
          missing = [r for r in required if not any(n.endswith(r) for n in names)]
          if missing:
              sys.exit(f"wheel is missing: {missing}")
          print(f"{whl}: all required assets present")
          PY
